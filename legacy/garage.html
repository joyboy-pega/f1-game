<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Buddh Circuit · 3D Cardboard Car Showcase & Customizer Sandbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { user-select: none; -webkit-user-select: none; box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #1e140c;
      font-family: 'Space Grotesk', sans-serif;
    }
    .marker-font { font-family: 'Permanent Marker', cursive; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; }

    .cardboard-panel {
      background-color: #c58b53;
      background-image: 
        repeating-linear-gradient(-18deg, rgba(80, 42, 12, 0.08) 0px, rgba(80, 42, 12, 0.08) 2px, transparent 2px, transparent 7px),
        radial-gradient(circle at 20% 20%, rgba(255,230,190,0.2), transparent 70%);
      border: 3px solid #5c3614;
      box-shadow: 0 6px 0 #3f230a, 0 10px 18px rgba(0,0,0,0.5);
      position: relative;
    }
    .duct-tape {
      background: linear-gradient(135deg, #b8bcc2 0%, #8e9299 50%, #a5a9b0 100%);
      border: 1px solid rgba(60,60,65,0.5);
      box-shadow: 1px 2px 4px rgba(0,0,0,0.35);
      position: absolute; pointer-events: none; z-index: 10;
    }
    .cb-btn {
      background-color: #d69d66;
      border: 2px solid #3d2109;
      box-shadow: 0 4px 0 #3d2109;
      transition: all 0.1s ease;
      cursor: pointer;
      color: #2b1704;
      font-weight: 700;
    }
    .cb-btn:hover { background-color: #e3af7b; transform: translateY(-1px); }
    .cb-btn:active, .cb-btn.active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3d2109;
    }
    .cb-btn.active {
      background-color: #c9302c;
      color: #ffffff;
      border-color: #2b0908;
    }
    .swatch {
      width: 26px; height: 26px; border-radius: 9999px;
      border: 2px solid #2b1704; cursor: pointer;
      transition: transform 0.12s ease;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { outline: 3px solid #fff; transform: scale(1.15); }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <!-- TOP BAR: Navigation, Car Switcher, Drive Mode & Camera Perspectives -->
  <div class="fixed top-3 left-3 right-3 z-20 flex flex-wrap justify-between items-start gap-2 pointer-events-none">
    
    <!-- Left Group: Navigation & Car/Drive Selector -->
    <div class="cardboard-panel rounded-xl p-3 pointer-events-auto flex flex-wrap items-center gap-2">
      <div class="duct-tape w-8 h-3 -top-1.5 left-3 -rotate-6"></div>
      
      <a href="index.html" class="cb-btn px-3 py-1 rounded-lg text-xs sm:text-sm font-bold flex items-center gap-1" title="Back to Pit Dashboard">
        ← PIT
      </a>

      <div class="h-5 w-[2px] bg-[#5c3614] mx-1"></div>

      <span class="marker-font text-base text-[#2b1704] mr-1">CAR:</span>
      <button id="btnCarStreet" class="cb-btn active px-3 py-1 rounded-lg text-xs sm:text-sm">🏎️ STREET RACER</button>
      <button id="btnCarF1" class="cb-btn px-3 py-1 rounded-lg text-xs sm:text-sm">🏁 FORMULA 1 (#7)</button>
      <button id="btnToggleBoth" class="cb-btn active px-2.5 py-1 rounded-lg text-xs" title="Show/Hide 2nd Car">👥 BOTH: ON</button>

      <div class="h-5 w-[2px] bg-[#5c3614] mx-1"></div>

      <span class="marker-font text-base text-[#2b1704] mr-1">DRIVE:</span>
      <button id="btnMoveManual" class="cb-btn active px-3 py-1 rounded-lg text-xs sm:text-sm">🎮 4-DIR (WASD)</button>
      <button id="btnMoveCircle" class="cb-btn px-3 py-1 rounded-lg text-xs sm:text-sm">🔄 CIRCLE</button>
    </div>

    <!-- Right Group: Perspectives & Direct Launch to Grand Prix -->
    <div class="cardboard-panel rounded-xl p-3 pointer-events-auto flex flex-wrap items-center gap-2">
      <div class="duct-tape w-8 h-3 -top-1.5 right-3 rotate-6"></div>
      <span class="marker-font text-base text-[#2b1704] mr-1">VIEW [C]:</span>
      <button data-cam="tpp" class="cam-btn cb-btn active px-3 py-1 rounded-lg text-xs sm:text-sm">CHASE (3D)</button>
      <button data-cam="cockpit" class="cam-btn cb-btn px-3 py-1 rounded-lg text-xs sm:text-sm">COCKPIT</button>
      <button data-cam="fpp" class="cam-btn cb-btn px-3 py-1 rounded-lg text-xs sm:text-sm">NOSE (FPP)</button>
      <button data-cam="orbit" class="cam-btn cb-btn px-3 py-1 rounded-lg text-xs sm:text-sm">360° ORBIT</button>

      <div class="h-5 w-[2px] bg-[#5c3614] mx-1"></div>

      <a id="btnLaunchTrack" href="Buddh%20Circuit%20%E2%80%93%20F1%20Cockpit.html" class="cb-btn px-3.5 py-1 rounded-lg text-xs sm:text-sm bg-[#c9302c] text-white flex items-center gap-1 font-bold" title="Drive this Car on Buddh International Circuit">
        🏁 RACE ON TRACK →
      </a>
    </div>
  </div>

  <!-- LEFT PANEL: Live Color & Paint Customizer -->
  <div class="fixed left-3 top-24 z-20 cardboard-panel rounded-xl p-3.5 w-64 text-[#2b1704]">
    <div class="duct-tape w-10 h-3.5 -top-2 left-6 rotate-3"></div>
    <h2 class="marker-font text-lg border-b-2 border-[#5c3614] pb-1 mb-2.5">🎨 PAINT & CUSTOMIZE</h2>

    <!-- Cardboard Body Color -->
    <div class="mb-3">
      <div class="flex justify-between items-center text-xs font-bold mb-1">
        <span>CARDBOARD BODY</span>
        <input type="color" id="pickerBody" value="#b97a45" class="w-6 h-6 rounded cursor-pointer border border-[#3d2109] bg-transparent" />
      </div>
      <div class="flex gap-1.5 flex-wrap" id="swatchesBody">
        <div class="swatch active" data-color="#b97a45" style="background:#b97a45" title="Classic Kraft Cardboard"></div>
        <div class="swatch" data-color="#d9a773" style="background:#d9a773" title="Light Box Tan"></div>
        <div class="swatch" data-color="#8c5327" style="background:#8c5327" title="Dark Espresso Box"></div>
        <div class="swatch" data-color="#d4cfc7" style="background:#d4cfc7" title="White Mailer Box"></div>
        <div class="swatch" data-color="#4f7745" style="background:#4f7745" title="Army Carton Green"></div>
        <div class="swatch" data-color="#3b5b8c" style="background:#3b5b8c" title="Blue Carton"></div>
      </div>
    </div>

    <!-- Racing Stripe / Accent Color -->
    <div class="mb-3">
      <div class="flex justify-between items-center text-xs font-bold mb-1">
        <span>STRIPE & ACCENT</span>
        <input type="color" id="pickerAccent" value="#c92a2a" class="w-6 h-6 rounded cursor-pointer border border-[#3d2109] bg-transparent" />
      </div>
      <div class="flex gap-1.5 flex-wrap" id="swatchesAccent">
        <div class="swatch active" data-color="#c92a2a" style="background:#c92a2a" title="Racing Red"></div>
        <div class="swatch" data-color="#2563eb" style="background:#2563eb" title="Electric Blue"></div>
        <div class="swatch" data-color="#eab308" style="background:#eab308" title="Yellow"></div>
        <div class="swatch" data-color="#16a34a" style="background:#16a34a" title="Emerald Green"></div>
        <div class="swatch" data-color="#9333ea" style="background:#9333ea" title="Purple"></div>
        <div class="swatch" data-color="#18181b" style="background:#18181b" title="Stealth Black"></div>
      </div>
    </div>

    <!-- Wheel Rim Color -->
    <div class="mb-3">
      <div class="flex justify-between items-center text-xs font-bold mb-1">
        <span>WHEEL HUBS</span>
        <input type="color" id="pickerRim" value="#cf9560" class="w-6 h-6 rounded cursor-pointer border border-[#3d2109] bg-transparent" />
      </div>
      <div class="flex gap-1.5 flex-wrap" id="swatchesRim">
        <div class="swatch active" data-color="#cf9560" style="background:#cf9560" title="Kraft Wheel Hub"></div>
        <div class="swatch" data-color="#e5e7eb" style="background:#e5e7eb" title="Silver Tape"></div>
        <div class="swatch" data-color="#f59e0b" style="background:#f59e0b" title="Amber Orange"></div>
        <div class="swatch" data-color="#ef4444" style="background:#ef4444" title="Racing Red"></div>
        <div class="swatch" data-color="#1f2937" style="background:#1f2937" title="Dark Carbon"></div>
      </div>
    </div>

    <!-- Circle Radius Slider (When in Auto-Circle or Arena Ring) -->
    <div class="mb-1">
      <div class="flex justify-between text-xs font-bold mb-1">
        <span>ARENA RING RADIUS</span>
        <span id="radiusVal">28m</span>
      </div>
      <input id="sliderRadius" type="range" min="14" max="50" value="28" class="w-full accent-[#5c3614] cursor-pointer" />
    </div>
  </div>

  <!-- BOTTOM BAR: Speedometer + On-Screen 4-Direction Pad -->
  <div class="fixed bottom-3 left-3 right-3 z-20 flex justify-between items-end pointer-events-none">
    
    <!-- Telemetry & Instructions -->
    <div class="cardboard-panel rounded-xl p-3 pointer-events-auto flex items-center gap-4">
      <div class="duct-tape w-9 h-3 -top-1.5 left-4 -rotate-6"></div>
      <div>
        <span id="hudCarTitle" class="marker-font text-lg text-[#2b1704] block">DIY STREET RACER</span>
        <span id="hudViewTitle" class="text-xs font-bold text-[#47270b] block">VIEW: CHASE (3D)</span>
        <span class="text-[11px] text-[#3d2109] block mt-0.5"><b>WASD / Arrows</b>: Move • <b>Space</b>: Nitro • <b>R</b>: Center • <b>C</b>: Camera</span>
      </div>
      <div class="border-l-2 border-[#5c3614] pl-3 text-right min-w-[75px]">
        <span id="speedReadout" class="marker-font text-3xl text-[#9e1b1b]">0</span>
        <span class="text-[10px] font-bold text-[#2b1704] block -mt-1">KM/H</span>
      </div>
    </div>

    <!-- On-Screen 4-Direction D-Pad + Boost -->
    <div class="cardboard-panel rounded-xl p-2.5 pointer-events-auto flex items-center gap-2">
      <div class="grid grid-cols-3 gap-1.5 w-36">
        <div></div>
        <button id="padUp" class="cb-btn h-10 rounded-lg flex items-center justify-center text-lg">▲</button>
        <div></div>
        <button id="padLeft" class="cb-btn h-10 rounded-lg flex items-center justify-center text-lg">◀</button>
        <button id="padDown" class="cb-btn h-10 rounded-lg flex items-center justify-center text-lg">▼</button>
        <button id="padRight" class="cb-btn h-10 rounded-lg flex items-center justify-center text-lg">▶</button>
      </div>
      <div class="flex flex-col gap-1.5">
        <button id="padBoost" class="cb-btn px-3 h-10 rounded-lg text-xs bg-[#c9302c] text-white">🔥 NITRO</button>
        <button id="btnResetPos" class="cb-btn px-3 h-10 rounded-lg text-xs">📍 CENTER [R]</button>
      </div>
    </div>

  </div>

  <script>
    /********************************************************************
     * 1. DYNAMIC PROCEDURAL CARDBOARD & DECAL TEXTURES
     ********************************************************************/
    let currentBodyHex = localStorage.getItem('f1_body_color') || '#b97a45';
    let currentAccentHex = localStorage.getItem('f1_accent_color') || '#c92a2a';
    let currentRimHex = localStorage.getItem('f1_rim_color') || '#cf9560';
    let activeCarKey = localStorage.getItem('formula_v_car') === 'f1' ? 'f1' : 'street';

    function makeCorrugatedTexture(baseHex, grainAngle = -18) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');

      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 256, 256);

      ctx.save();
      ctx.translate(128, 128);
      ctx.rotate((grainAngle * Math.PI) / 180);
      ctx.translate(-128, -128);

      ctx.strokeStyle = 'rgba(35, 16, 4, 0.22)';
      for (let y = -60; y < 320; y += 7) {
        ctx.lineWidth = (y % 14 === 0) ? 2.2 : 1.1;
        ctx.beginPath();
        ctx.moveTo(-60, y);
        ctx.lineTo(320, y);
        ctx.stroke();
      }
      ctx.restore();

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function makeCrownGrillTex(bodyHex) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bodyHex;
      ctx.fillRect(0, 0, 256, 128);

      ctx.strokeStyle = '#1d1916';
      ctx.lineWidth = 6;
      ctx.lineJoin = 'round';

      // Drawn Crown
      ctx.beginPath();
      ctx.moveTo(102, 42);
      ctx.lineTo(96, 16);
      ctx.lineTo(114, 29);
      ctx.lineTo(128, 13);
      ctx.lineTo(142, 29);
      ctx.lineTo(160, 16);
      ctx.lineTo(154, 42);
      ctx.closePath();
      ctx.stroke();

      // Grill Box
      ctx.strokeRect(72, 54, 112, 58);
      for (let y = 70; y <= 98; y += 14) {
        ctx.beginPath();
        ctx.moveTo(72, y);
        ctx.lineTo(184, y);
        ctx.stroke();
      }
      return new THREE.CanvasTexture(c);
    }

    function makeDoorStarTex(bodyHex, accentHex) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bodyHex;
      ctx.fillRect(0, 0, 256, 128);

      // Diagonal stripe
      ctx.fillStyle = accentHex;
      ctx.beginPath();
      ctx.moveTo(170, 128);
      ctx.lineTo(225, 0);
      ctx.lineTo(252, 0);
      ctx.lineTo(198, 128);
      ctx.closePath();
      ctx.fill();

      // Hand-drawn black star
      ctx.strokeStyle = '#1d1916';
      ctx.lineWidth = 6;
      ctx.lineJoin = 'round';
      const cx = 110, cy = 68, rOut = 34, rIn = 15;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? rOut : rIn;
        const a = (i * Math.PI) / 5 - Math.PI / 2;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();

      ctx.fillStyle = '#241509';
      ctx.fillRect(150, 22, 34, 9);
      return new THREE.CanvasTexture(c);
    }

    function makeF1NoseTex(bodyHex, accentHex) {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bodyHex;
      ctx.fillRect(0, 0, 128, 256);

      ctx.fillStyle = accentHex;
      ctx.fillRect(22, 0, 24, 256);

      ctx.strokeStyle = '#1d1916';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(52, 110);
      ctx.lineTo(92, 110);
      ctx.lineTo(66, 165);
      ctx.moveTo(56, 138);
      ctx.lineTo(88, 138);
      ctx.stroke();

      return new THREE.CanvasTexture(c);
    }

    // Shared Customizer Materials
    const MATS = {
      body: new THREE.MeshStandardMaterial({ map: makeCorrugatedTexture(currentBodyHex), roughness: 0.88, flatShading: true }),
      cbDark: new THREE.MeshStandardMaterial({ color: 0x523015, roughness: 0.94, flatShading: true }),
      accent: new THREE.MeshStandardMaterial({ color: currentAccentHex, roughness: 0.72, flatShading: true }),
      rim: new THREE.MeshStandardMaterial({ color: currentRimHex, roughness: 0.82, flatShading: true }),
      tape: new THREE.MeshStandardMaterial({ color: 0x92969c, roughness: 0.38, metalness: 0.25, flatShading: true }),
      tire: new THREE.MeshStandardMaterial({ color: 0x1e1c1a, roughness: 0.88, flatShading: true }),
      headlight: new THREE.MeshStandardMaterial({ color: 0xffe07d, emissive: 0xffb72b, emissiveIntensity: 0.95, roughness: 0.2, flatShading: true }),
      glass: new THREE.MeshStandardMaterial({ color: 0x99a8b8, transparent: true, opacity: 0.42, roughness: 0.15, flatShading: true, side: THREE.DoubleSide }),
      crownGrill: new THREE.MeshStandardMaterial({ map: makeCrownGrillTex(currentBodyHex), roughness: 0.88, flatShading: true }),
      doorStar: new THREE.MeshStandardMaterial({ map: makeDoorStarTex(currentBodyHex, currentAccentHex), roughness: 0.88, flatShading: true }),
      f1Nose: new THREE.MeshStandardMaterial({ map: makeF1NoseTex(currentBodyHex, currentAccentHex), roughness: 0.88, flatShading: true })
    };

    function persistCustomizer() {
      localStorage.setItem('f1_body_color', currentBodyHex);
      localStorage.setItem('f1_accent_color', currentAccentHex);
      localStorage.setItem('f1_rim_color', currentRimHex);
      localStorage.setItem('formula_v_car', activeCarKey);

      const trackBtn = document.getElementById('btnLaunchTrack');
      if (trackBtn) {
        trackBtn.href = `Buddh%20Circuit%20%E2%80%93%20F1%20Cockpit.html?car=${activeCarKey}&cam=${camMode}&body=${encodeURIComponent(currentBodyHex)}&accent=${encodeURIComponent(currentAccentHex)}&rim=${encodeURIComponent(currentRimHex)}`;
      }
    }

    function refreshCustomMaterials() {
      MATS.body.map = makeCorrugatedTexture(currentBodyHex);
      MATS.body.needsUpdate = true;

      MATS.accent.color.set(currentAccentHex);
      MATS.rim.color.set(currentRimHex);

      MATS.crownGrill.map = makeCrownGrillTex(currentBodyHex);
      MATS.crownGrill.needsUpdate = true;

      MATS.doorStar.map = makeDoorStarTex(currentBodyHex, currentAccentHex);
      MATS.doorStar.needsUpdate = true;

      MATS.f1Nose.map = makeF1NoseTex(currentBodyHex, currentAccentHex);
      MATS.f1Nose.needsUpdate = true;

      persistCustomizer();
    }

    /********************************************************************
     * 2. THREE.JS SCENE, LIGHTS & CLEAN CIRCULAR STUDIO ARENA
     ********************************************************************/
    const canvas = document.getElementById('gameCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeae2d6);
    scene.fog = new THREE.FogExp2(0xeae2d6, 0.0045);

    const hemiLight = new THREE.HemisphereLight(0xfff9f0, 0x8c6845, 0.78);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff3de, 1.15);
    sunLight.position.set(60, 110, 75);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    const d = 85;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // Clean Studio Floor + Circular Reference Track Ring
    const floorMat = new THREE.MeshStandardMaterial({
      map: makeCorrugatedTexture('#d4b48c', 0),
      roughness: 0.92
    });
    floorMat.map.repeat.set(16, 16);
    const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(360, 360), floorMat);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    const gridHelper = new THREE.GridHelper(240, 60, 0x8c6239, 0xbca07c);
    gridHelper.position.y = 0.02;
    scene.add(gridHelper);

    // Dynamic Circular Track Ring
    let circleRadius = 28;
    let ringGroup = new THREE.Group();
    scene.add(ringGroup);

    function rebuildCircleRing(radius) {
      while (ringGroup.children.length > 0) {
        ringGroup.remove(ringGroup.children[0]);
      }
      const roadGeo = new THREE.RingGeometry(radius - 4.2, radius + 4.2, 96);
      roadGeo.rotateX(-Math.PI / 2);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x282a2e, roughness: 0.85, side: THREE.DoubleSide });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.position.y = 0.04;
      road.receiveShadow = true;
      ringGroup.add(road);

      const dashCount = 48;
      const dashGeo = new THREE.BoxGeometry(0.35, 0.04, 1.8);
      const dashMat = new THREE.MeshBasicMaterial({ color: 0xf5f5f0 });
      for (let i = 0; i < dashCount; i++) {
        const ang = (i / dashCount) * Math.PI * 2;
        const dash = new THREE.Mesh(dashGeo, dashMat);
        dash.position.set(Math.cos(ang) * radius, 0.06, Math.sin(ang) * radius);
        dash.rotation.y = -ang;
        ringGroup.add(dash);
      }
    }
    rebuildCircleRing(circleRadius);

    /********************************************************************
     * 3. THE 2 LOW-POLY CARDBOARD CARS (STREET RACER & F1 #7)
     ********************************************************************/
    const CAR_SCALE = 2.4;

    function addCarBox(parent, sx, sy, sz, bx, by, bz, rotXDeg = 0, rotYDeg = 0, rotZDeg = 0, mat = MATS.body) {
      const geo = new THREE.BoxGeometry(sx, sz, sy);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(-bx, bz, -by);
      mesh.rotation.set(
        THREE.MathUtils.degToRad(rotXDeg),
        THREE.MathUtils.degToRad(rotZDeg),
        THREE.MathUtils.degToRad(rotYDeg)
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function createLowPolyWheel(radius, width) {
      const wheelPivot = new THREE.Group();
      const spinGroup = new THREE.Group();
      wheelPivot.add(spinGroup);

      const tireGeo = new THREE.CylinderGeometry(radius, radius, width, 10);
      tireGeo.rotateZ(Math.PI / 2);
      const tire = new THREE.Mesh(tireGeo, MATS.tire);
      tire.castShadow = true;
      spinGroup.add(tire);

      const hubGeo = new THREE.CylinderGeometry(radius * 0.56, radius * 0.56, width + 0.04, 10);
      hubGeo.rotateZ(Math.PI / 2);
      const hub = new THREE.Mesh(hubGeo, MATS.rim);
      spinGroup.add(hub);

      const nutGeo = new THREE.CylinderGeometry(radius * 0.2, radius * 0.2, width + 0.08, 6);
      nutGeo.rotateZ(Math.PI / 2);
      const nut = new THREE.Mesh(nutGeo, MATS.tape);
      spinGroup.add(nut);

      return { wheelPivot, spinGroup };
    }

    // CAR 1: DIY Cardboard Street Racer
    function buildStreetRacer() {
      const root = new THREE.Group();
      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);

      addCarBox(bodyGroup, 1.4, 1.1, 0.5, 0, -0.75, 0.45, 0, 0, 0, MATS.body);
      addCarBox(bodyGroup, 1.25, 0.04, 0.46, 0, -1.30, 0.45, 0, 0, 0, MATS.crownGrill);
      addCarBox(bodyGroup, 1.4, 0.9, 0.1, 0, 0.2, 0.25, 0, 0, 0, MATS.cbDark);
      addCarBox(bodyGroup, 0.12, 0.9, 0.5, -0.65, 0.2, 0.45, 0, 0, 0, MATS.doorStar);
      addCarBox(bodyGroup, 0.12, 0.9, 0.5, 0.65, 0.2, 0.45, 0, 0, 0, MATS.doorStar);
      addCarBox(bodyGroup, 1.4, 0.6, 0.6, 0, 0.9, 0.5, 0, 0, 0, MATS.body);

      // Hood Accent Stripe
      addCarBox(bodyGroup, 0.22, 1.08, 0.02, -0.25, -0.75, 0.705, 0, 0, 0, MATS.accent);

      // Seat
      addCarBox(bodyGroup, 0.85, 0.5, 0.2, 0, 0.35, 0.35, 0, 0, 0, MATS.cbDark);
      addCarBox(bodyGroup, 0.85, 0.15, 0.65, 0, 0.55, 0.65, -10, 0, 0, MATS.body);

      // Windshield & Pillars
      addCarBox(bodyGroup, 1.28, 0.04, 0.45, 0, -0.22, 0.88, -25, 0, 0, MATS.glass);
      addCarBox(bodyGroup, 0.1, 0.12, 0.48, -0.65, -0.22, 0.88, -25, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.1, 0.12, 0.48, 0.65, -0.22, 0.88, -25, 0, 0, MATS.body);

      // Steering Column & Interactive Steering Wheel
      addCarBox(bodyGroup, 0.08, 0.08, 0.4, 0, -0.15, 0.62, -35, 0, 0, MATS.body);
      const swGeo = new THREE.TorusGeometry(0.18, 0.035, 6, 12);
      const steeringWheel = new THREE.Mesh(swGeo, MATS.tire);
      steeringWheel.position.set(0, 0.78, 0.05);
      steeringWheel.rotation.x = THREE.MathUtils.degToRad(35);
      bodyGroup.add(steeringWheel);

      // Rear Spoiler
      addCarBox(bodyGroup, 0.08, 0.12, 0.4, -0.45, 1.0, 0.92, 15, 0, 0, MATS.cbDark);
      addCarBox(bodyGroup, 0.08, 0.12, 0.4, 0.45, 1.0, 0.92, 15, 0, 0, MATS.cbDark);
      addCarBox(bodyGroup, 1.5, 0.4, 0.06, 0, 1.05, 1.12, 10, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.16, 0.39, 0.07, -0.35, 1.05, 1.125, 10, 0, 0, MATS.accent);
      addCarBox(bodyGroup, 0.16, 0.39, 0.07, 0.45, 1.05, 1.125, 10, 0, 0, MATS.accent);

      // Headlights & Duct Tape
      [-0.45, 0.45].forEach(x => {
        const rimGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.1, 10);
        rimGeo.rotateX(Math.PI / 2);
        const rim = new THREE.Mesh(rimGeo, MATS.body);
        rim.position.set(-x, 0.42, 1.3);
        bodyGroup.add(rim);

        const bulbGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.12, 10);
        bulbGeo.rotateX(Math.PI / 2);
        const bulb = new THREE.Mesh(bulbGeo, MATS.headlight);
        bulb.position.set(-x, 0.42, 1.32);
        bodyGroup.add(bulb);

        addCarBox(bodyGroup, 0.25, 0.45, 0.05, x * 1.45, -0.8, 0.55, 0, 0, 0, MATS.body);
        addCarBox(bodyGroup, 0.18, 0.18, 0.09, x * 1.48, -1.26, 0.68, 0, 0, 0, MATS.tape);
      });

      const wheels = { front: [], allSpin: [] };
      [
        [-0.82, -0.8, 0.32, true],
        [ 0.82, -0.8, 0.32, true],
        [-0.82,  0.8, 0.32, false],
        [ 0.82,  0.8, 0.32, false]
      ].forEach(([wx, wy, wz, isFront]) => {
        const { wheelPivot, spinGroup } = createLowPolyWheel(0.32, 0.26);
        wheelPivot.position.set(-wx, wz, -wy);
        root.add(wheelPivot);
        if (isFront) wheels.front.push(wheelPivot);
        wheels.allSpin.push(spinGroup);
      });

      root.scale.setScalar(CAR_SCALE);
      return {
        root, bodyGroup, wheels, steeringWheel,
        cockpitCamOffset: new THREE.Vector3(0, 2.32, -0.52),
        fppCamOffset: new THREE.Vector3(0, 1.85, 1.85)
      };
    }

    // CAR 2: DIY Cardboard Formula 1 Car (#7)
    function buildF1Car() {
      const root = new THREE.Group();
      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);

      addCarBox(bodyGroup, 1.35, 2.2, 0.04, 0, 0.15, 0.14, 0, 0, 0, MATS.cbDark);
      addCarBox(bodyGroup, 0.52, 1.5, 0.42, 0, -0.1, 0.36, 0, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.36, 1.0, 0.26, 0, -1.25, 0.28, -10, 0, 0, MATS.f1Nose);

      // Front Wing
      addCarBox(bodyGroup, 1.65, 0.38, 0.04, 0, -1.75, 0.14, 0, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.55, 0.22, 0.03, -0.45, -1.68, 0.21, -18, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.55, 0.22, 0.03,  0.45, -1.68, 0.21, -18, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.04, 0.46, 0.24, -0.82, -1.72, 0.22, 0, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.04, 0.46, 0.24,  0.82, -1.72, 0.22, 0, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.12, 0.36, 0.02, -0.55, -1.76, 0.165, 0, 0, 0, MATS.accent);
      addCarBox(bodyGroup, 0.12, 0.36, 0.02,  0.55, -1.76, 0.165, 0, 0, 0, MATS.accent);

      // Cockpit & Steering Wheel
      addCarBox(bodyGroup, 0.06, 0.65, 0.16, -0.23, 0.05, 0.62, 0, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.06, 0.65, 0.16,  0.23, 0.05, 0.62, 0, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.42, 0.12, 0.12, 0, -0.25, 0.63, -25, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.36, 0.12, 0.45, 0, 0.28, 0.52, -15, 0, 0, MATS.cbDark);

      const swGeo = new THREE.TorusGeometry(0.13, 0.025, 6, 10);
      const steeringWheel = new THREE.Mesh(swGeo, MATS.tire);
      steeringWheel.position.set(0, 0.62, 0.08);
      steeringWheel.rotation.x = THREE.MathUtils.degToRad(55);
      bodyGroup.add(steeringWheel);

      // Sidepods
      [-1, 1].forEach(side => {
        const xPos = side * 0.48;
        addCarBox(bodyGroup, 0.44, 0.95, 0.38, xPos, 0.25, 0.35, 0, 0, 0, MATS.doorStar);
        addCarBox(bodyGroup, 0.36, 0.05, 0.30, xPos, -0.23, 0.35, 0, 0, 0, MATS.cbDark);
        addCarBox(bodyGroup, 0.46, 0.25, 0.04, xPos, -0.18, 0.55, 0, 0, 0, MATS.body);
        addCarBox(bodyGroup, 0.42, 0.12, 0.02, xPos, 0.45, 0.545, 0, 0, 0, MATS.accent);
      });

      // Airbox & Engine Cover
      addCarBox(bodyGroup, 0.32, 0.45, 0.42, 0, 0.55, 0.78, 0, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.18, 0.05, 0.18, 0, 0.32, 0.88, 0, 0, 0, MATS.cbDark);
      addCarBox(bodyGroup, 0.28, 0.75, 0.38, 0, 0.92, 0.65, 22, 0, 0, MATS.body);

      // Rear Wing
      addCarBox(bodyGroup, 0.05, 0.16, 0.48, -0.12, 1.32, 0.72, -12, 0, 0, MATS.cbDark);
      addCarBox(bodyGroup, 0.05, 0.16, 0.48,  0.12, 1.32, 0.72, -12, 0, 0, MATS.cbDark);
      addCarBox(bodyGroup, 1.35, 0.32, 0.04, 0, 1.38, 0.92, 0, 0, 0, MATS.body);
      addCarBox(bodyGroup, 1.35, 0.22, 0.04, 0, 1.48, 1.04, 25, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.04, 0.48, 0.52, -0.68, 1.40, 0.86, 0, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.04, 0.48, 0.52,  0.68, 1.40, 0.86, 0, 0, 0, MATS.body);
      addCarBox(bodyGroup, 0.14, 0.30, 0.02, -0.25, 1.38, 0.945, 0, 0, 0, MATS.accent);

      // Suspension & Tape
      [-1, 1].forEach(side => {
        addCarBox(bodyGroup, 0.55, 0.06, 0.04, side * 0.48, -0.95, 0.36, 0, side * 8, side * 10, MATS.body);
        addCarBox(bodyGroup, 0.55, 0.06, 0.04, side * 0.48, -0.82, 0.22, 0, 0, -side * 8, MATS.cbDark);
        addCarBox(bodyGroup, 0.55, 0.07, 0.04, side * 0.52, 0.95, 0.38, 0, 0, 0, MATS.body);
        addCarBox(bodyGroup, 0.55, 0.07, 0.04, side * 0.52, 1.08, 0.24, 0, 0, 0, MATS.cbDark);
        addCarBox(bodyGroup, 0.11, 0.15, 0.08, side * 0.14, -1.58, 0.26, -10, 0, 0, MATS.tape);
      });

      const wheels = { front: [], allSpin: [] };
      [
        [-0.82, -0.90, 0.32, 0.32, 0.30, true],
        [ 0.82, -0.90, 0.32, 0.32, 0.30, true],
        [-0.86,  0.98, 0.36, 0.36, 0.38, false],
        [ 0.86,  0.98, 0.36, 0.36, 0.38, false]
      ].forEach(([wx, wy, wz, rad, width, isFront]) => {
        const { wheelPivot, spinGroup } = createLowPolyWheel(rad, width);
        wheelPivot.position.set(-wx, wz, -wy);
        root.add(wheelPivot);
        if (isFront) wheels.front.push(wheelPivot);
        wheels.allSpin.push(spinGroup);
      });

      root.scale.setScalar(CAR_SCALE);
      return {
        root, bodyGroup, wheels, steeringWheel,
        cockpitCamOffset: new THREE.Vector3(0, 1.92, -0.25),
        fppCamOffset: new THREE.Vector3(0, 1.35, 2.75)
      };
    }

    // Instantiate both cars
    const carStreet = buildStreetRacer();
    const carF1 = buildF1Car();
    scene.add(carStreet.root);
    scene.add(carF1.root);

    /********************************************************************
     * 4. VEHICLE MOVEMENT (4-DIRECTION MANUAL + AUTO-CIRCLE MODE)
     ********************************************************************/
    let showBothCars = true;
    let moveMode = 'manual';     // 'manual' or 'circle'
    let camMode = 'tpp';         // 'tpp', 'cockpit', 'fpp', 'orbit'

    const state = {
      street: { pos: new THREE.Vector3(-circleRadius, 0, 0), heading: 0, speed: 0, steer: 0, circleAngle: Math.PI },
      f1:     { pos: new THREE.Vector3(circleRadius, 0, 0),  heading: Math.PI, speed: 0, steer: 0, circleAngle: 0 }
    };

    const keys = {};
    const padState = { up: false, down: false, left: false, right: false, boost: false };

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyC') cycleCameraMode();
      if (e.code === 'KeyR') resetActiveCar();
      if (e.code === 'KeyV') toggleCarSelection();
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    function bindPad(id, key) {
      const btn = document.getElementById(id);
      const on = (e) => { e.preventDefault(); padState[key] = true; };
      const off = (e) => { e.preventDefault(); padState[key] = false; };
      btn.addEventListener('mousedown', on);
      btn.addEventListener('mouseup', off);
      btn.addEventListener('mouseleave', off);
      btn.addEventListener('touchstart', on, { passive: false });
      btn.addEventListener('touchend', off, { passive: false });
    }
    bindPad('padUp', 'up');
    bindPad('padDown', 'down');
    bindPad('padLeft', 'left');
    bindPad('padRight', 'right');
    bindPad('padBoost', 'boost');

    function resetActiveCar() {
      const s = state[activeCarKey];
      s.pos.set(0, 0, 0);
      s.heading = 0;
      s.speed = 0;
    }

    function toggleCarSelection() {
      if (activeCarKey === 'street') {
        document.getElementById('btnCarF1').click();
      } else {
        document.getElementById('btnCarStreet').click();
      }
    }

    function updateSingleCar(carObj, carState, dt, isPlayerControlled) {
      if (moveMode === 'circle' || !isPlayerControlled) {
        // Smooth circular movement around the ring
        const angularSpeed = isPlayerControlled ? 0.85 : 0.68;
        carState.circleAngle += angularSpeed * dt;
        const r = isPlayerControlled ? circleRadius : (circleRadius + 6.5);
        carState.pos.x = Math.cos(carState.circleAngle) * r;
        carState.pos.z = Math.sin(carState.circleAngle) * r;
        carState.heading = Math.atan2(-Math.sin(carState.circleAngle), Math.cos(carState.circleAngle));
        carState.speed = angularSpeed * r;
        carState.steer = 0.28;
      } else {
        // 4-Direction Free Movement (Forward, Backward, Left, Right)
        const up = keys['KeyW'] || keys['ArrowUp'] || padState.up;
        const down = keys['KeyS'] || keys['ArrowDown'] || padState.down;
        const left = keys['KeyA'] || keys['ArrowLeft'] || padState.left;
        const right = keys['KeyD'] || keys['ArrowRight'] || padState.right;
        const boost = keys['Space'] || keys['ShiftLeft'] || padState.boost;

        const maxSpd = boost ? 58 : 36;
        const accel = boost ? 65 : 42;

        if (up) carState.speed += accel * dt;
        else if (down) carState.speed -= accel * 0.9 * dt;
        else carState.speed *= Math.pow(0.18, dt);

        carState.speed = THREE.MathUtils.clamp(carState.speed, -22, maxSpd);

        let steerInput = 0;
        if (left) steerInput = 1;
        if (right) steerInput = -1;

        carState.steer = THREE.MathUtils.lerp(carState.steer, steerInput * 0.45, 12 * dt);

        const turnDir = carState.speed >= -0.2 ? 1 : -1;
        const moveFactor = Math.max(0.35, Math.min(1, Math.abs(carState.speed) / 10));
        carState.heading += steerInput * 2.4 * moveFactor * turnDir * dt;

        carState.pos.x += Math.sin(carState.heading) * carState.speed * dt;
        carState.pos.z += Math.cos(carState.heading) * carState.speed * dt;
      }

      // Sync 3D Model Transform, Wheel Spin & Steering Wheel
      carObj.root.position.copy(carState.pos);
      carObj.root.rotation.y = carState.heading;

      carObj.wheels.front.forEach(w => { w.rotation.y = carState.steer; });
      carObj.wheels.allSpin.forEach(s => { s.rotation.x += carState.speed * dt * 0.6; });
      if (carObj.steeringWheel) {
        carObj.steeringWheel.rotation.z = -carState.steer * 2.2;
      }
    }

    /********************************************************************
     * 5. PERSPECTIVE CAMERAS (TPP, COCKPIT, FPP, 360 ORBIT)
     ********************************************************************/
    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.2, 800);
    let orbitYaw = 0.6;
    let orbitPitch = 0.38;
    let orbitDist = 14.5;
    let isDraggingOrbit = false;
    let prevMouse = { x: 0, y: 0 };

    canvas.addEventListener('mousedown', (e) => {
      isDraggingOrbit = true;
      prevMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mouseup', () => { isDraggingOrbit = false; });
    window.addEventListener('mousemove', (e) => {
      if (!isDraggingOrbit) return;
      orbitYaw -= (e.clientX - prevMouse.x) * 0.008;
      orbitPitch = THREE.MathUtils.clamp(orbitPitch + (e.clientY - prevMouse.y) * 0.006, 0.08, 1.35);
      prevMouse = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener('wheel', (e) => {
      orbitDist = THREE.MathUtils.clamp(orbitDist + e.deltaY * 0.015, 6, 38);
    });

    function updateCamera(dt) {
      const carObj = activeCarKey === 'street' ? carStreet : carF1;
      const s = state[activeCarKey];

      const forward = new THREE.Vector3(Math.sin(s.heading), 0, Math.cos(s.heading));
      const right = new THREE.Vector3(Math.cos(s.heading), 0, -Math.sin(s.heading));

      if (camMode === 'tpp') {
        // Third-Person Chase Perspective
        const desiredPos = s.pos.clone()
          .addScaledVector(forward, -12.5)
          .add(new THREE.Vector3(0, 5.2, 0));
        camera.position.lerp(desiredPos, Math.min(1, 9 * dt));
        const lookTarget = s.pos.clone().addScaledVector(forward, 8).add(new THREE.Vector3(0, 1.6, 0));
        camera.lookAt(lookTarget);
      } else if (camMode === 'cockpit') {
        // Inside-Cabin Cockpit Perspective (Over the Steering Wheel)
        const off = carObj.cockpitCamOffset;
        const camPos = s.pos.clone()
          .addScaledVector(right, off.x)
          .add(new THREE.Vector3(0, off.y, 0))
          .addScaledVector(forward, off.z);
        camera.position.copy(camPos);
        const lookTarget = camPos.clone()
          .addScaledVector(forward, 20)
          .add(new THREE.Vector3(0, -0.8, 0));
        camera.lookAt(lookTarget);
      } else if (camMode === 'fpp') {
        // First-Person Front Hood / Nose Perspective
        const off = carObj.fppCamOffset;
        const camPos = s.pos.clone()
          .add(new THREE.Vector3(0, off.y, 0))
          .addScaledVector(forward, off.z);
        camera.position.copy(camPos);
        const lookTarget = camPos.clone().addScaledVector(forward, 28);
        camera.lookAt(lookTarget);
      } else if (camMode === 'orbit') {
        // 360° Interactive Mouse Orbit Perspective
        const ox = s.pos.x + Math.sin(orbitYaw) * Math.cos(orbitPitch) * orbitDist;
        const oy = s.pos.y + Math.sin(orbitPitch) * orbitDist;
        const oz = s.pos.z + Math.cos(orbitYaw) * Math.cos(orbitPitch) * orbitDist;
        camera.position.set(ox, oy, oz);
        camera.lookAt(s.pos.x, s.pos.y + 1.4, s.pos.z);
      }
    }

    /********************************************************************
     * 6. UI CONTROLS & COLOR PICKER BINDINGS
     ********************************************************************/
    const camOrder = ['tpp', 'cockpit', 'fpp', 'orbit'];
    const camTitles = {
      tpp: 'CHASE (3D)',
      cockpit: 'COCKPIT (DRIVER VIEW)',
      fpp: 'NOSE (FPP)',
      orbit: '360° MOUSE ORBIT'
    };

    function setCameraMode(mode) {
      camMode = mode;
      document.querySelectorAll('.cam-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cam === mode);
      });
      document.getElementById('hudViewTitle').textContent = `VIEW: ${camTitles[mode]}`;
      persistCustomizer();
    }

    function cycleCameraMode() {
      const nextIdx = (camOrder.indexOf(camMode) + 1) % camOrder.length;
      setCameraMode(camOrder[nextIdx]);
    }

    document.querySelectorAll('.cam-btn').forEach(btn => {
      btn.addEventListener('click', () => setCameraMode(btn.dataset.cam));
    });

    document.getElementById('btnCarStreet').addEventListener('click', (e) => {
      activeCarKey = 'street';
      e.currentTarget.classList.add('active');
      document.getElementById('btnCarF1').classList.remove('active');
      document.getElementById('hudCarTitle').textContent = 'DIY STREET RACER';
      updateCarVisibility();
      persistCustomizer();
    });

    document.getElementById('btnCarF1').addEventListener('click', (e) => {
      activeCarKey = 'f1';
      e.currentTarget.classList.add('active');
      document.getElementById('btnCarStreet').classList.remove('active');
      document.getElementById('hudCarTitle').textContent = 'DIY FORMULA 1 (#7)';
      updateCarVisibility();
      persistCustomizer();
    });

    function updateCarVisibility() {
      carStreet.root.visible = (activeCarKey === 'street') || showBothCars;
      carF1.root.visible = (activeCarKey === 'f1') || showBothCars;
    }

    document.getElementById('btnToggleBoth').addEventListener('click', (e) => {
      showBothCars = !showBothCars;
      e.currentTarget.classList.toggle('active', showBothCars);
      e.currentTarget.textContent = showBothCars ? '👥 BOTH: ON' : '👤 SINGLE CAR';
      updateCarVisibility();
    });

    document.getElementById('btnMoveManual').addEventListener('click', (e) => {
      moveMode = 'manual';
      e.currentTarget.classList.add('active');
      document.getElementById('btnMoveCircle').classList.remove('active');
    });

    document.getElementById('btnMoveCircle').addEventListener('click', (e) => {
      moveMode = 'circle';
      e.currentTarget.classList.add('active');
      document.getElementById('btnMoveManual').classList.remove('active');
    });

    document.getElementById('btnResetPos').addEventListener('click', resetActiveCar);

    // Color Swatches & Pickers
    function setupColorGroup(containerId, pickerId, onColorChange, initialColor) {
      const container = document.getElementById(containerId);
      const picker = document.getElementById(pickerId);
      picker.value = initialColor;
      container.querySelectorAll('.swatch').forEach(sw => {
        sw.classList.toggle('active', sw.dataset.color.toLowerCase() === initialColor.toLowerCase());
        sw.addEventListener('click', () => {
          container.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
          sw.classList.add('active');
          picker.value = sw.dataset.color;
          onColorChange(sw.dataset.color);
        });
      });
      picker.addEventListener('input', (e) => {
        container.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        onColorChange(e.target.value);
      });
    }

    setupColorGroup('swatchesBody', 'pickerBody', (hex) => {
      currentBodyHex = hex;
      refreshCustomMaterials();
    }, currentBodyHex);

    setupColorGroup('swatchesAccent', 'pickerAccent', (hex) => {
      currentAccentHex = hex;
      refreshCustomMaterials();
    }, currentAccentHex);

    setupColorGroup('swatchesRim', 'pickerRim', (hex) => {
      currentRimHex = hex;
      refreshCustomMaterials();
    }, currentRimHex);

    // Initial vehicle UI activation
    if (activeCarKey === 'f1') {
      document.getElementById('btnCarF1').classList.add('active');
      document.getElementById('btnCarStreet').classList.remove('active');
      document.getElementById('hudCarTitle').textContent = 'DIY FORMULA 1 (#7)';
    }

    document.getElementById('sliderRadius').addEventListener('input', (e) => {
      circleRadius = parseFloat(e.target.value);
      document.getElementById('radiusVal').textContent = `${circleRadius}m`;
      rebuildCircleRing(circleRadius);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initialize initial customizer state
    persistCustomizer();
    updateCarVisibility();

    /********************************************************************
     * 7. MAIN ANIMATION LOOP
     ********************************************************************/
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      updateSingleCar(carStreet, state.street, dt, activeCarKey === 'street');
      updateSingleCar(carF1, state.f1, dt, activeCarKey === 'f1');

      updateCamera(dt);

      const activeSpeed = Math.round(Math.abs(state[activeCarKey].speed) * 2.8);
      document.getElementById('speedReadout').textContent = activeSpeed;

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
