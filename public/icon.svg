<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff4d"/>
      <stop offset="100%" stop-color="#a6e600"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e33"/>
      <stop offset="100%" stop-color="#e64c00"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Subtle racing track apex line -->
  <path d="M 60 410 C 180 430, 310 390, 452 230" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="32" stroke-linecap="round"/>

  <!-- Dynamic F1 Speed Chevron Stripes -->
  <path d="M 120 380 L 190 380 L 320 140 L 250 140 Z" fill="url(#orangeGrad)"/>
  <path d="M 210 380 L 320 380 L 440 140 L 330 140 Z" fill="url(#limeGrad)"/>

  <!-- Racing Wing Flap Tip -->
  <polygon points="120,380 90,380 180,210 210,210" fill="#ffffff" opacity="0.9"/>

  <!-- Team/Brand Emblem "53" / "S" hint in Anton/Bold style -->
  <text x="256" y="450" font-family="'Anton', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle">OPEN RACE</text>
</svg>