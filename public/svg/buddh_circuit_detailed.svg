<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 520 860" width="100%" height="100%">
  <defs>
    <!-- Background styling -->
    <radialGradient id="bg-grad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#181e2e" />
      <stop offset="60%" stop-color="#0e121a" />
      <stop offset="100%" stop-color="#080a0f" />
    </radialGradient>
    
    <!-- Track Outer Glow -->
    <filter id="track-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e10600" flood-opacity="0.2" />
    </filter>
    
    <!-- Kerb Pattern (Red and White) -->
    <pattern id="kerb-pattern" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#e10600" />
      <rect x="4" width="4" height="4" fill="#ffffff" />
    </pattern>

    <!-- Start/Finish Checkerboard -->
    <pattern id="finish-checkers" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#ffffff" />
      <rect x="3" y="3" width="3" height="3" fill="#ffffff" />
      <rect x="3" width="3" height="3" fill="#000000" />
      <rect y="3" width="3" height="3" fill="#000000" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect x="-40" y="-40" width="520" height="860" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="-40" y1="100" x2="480" y2="100" />
    <line x1="-40" y1="250" x2="480" y2="250" />
    <line x1="-40" y1="400" x2="480" y2="400" />
    <line x1="-40" y1="550" x2="480" y2="550" />
    <line x1="-40" y1="700" x2="480" y2="700" />
    <line x1="80" y1="-40" x2="80" y2="820" />
    <line x1="200" y1="-40" x2="200" y2="820" />
    <line x1="320" y1="-40" x2="320" y2="820" />
    <line x1="440" y1="-40" x2="440" y2="820" />
  </g>

  <!-- Circuit Title & Badges -->
  <g id="circuit-header" transform="translate(20, 10)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#e10600" letter-spacing="2">FORMULA 1 GRAND PRIX OF INDIA</text>
    <text y="20" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">BUDDH INTERNATIONAL CIRCUIT</text>
    <text y="36" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Greater Noida, Uttar Pradesh • 5.125 km • 16 Turns • Clockwise</text>
  </g>

  <!-- North Indicator -->
  <g id="compass" transform="translate(440, 40)">
    <circle r="16" fill="#161c28" stroke="#334155" stroke-width="1.5" />
    <polygon points="0,-12 3,2 0,0 -3,2" fill="#e10600" />
    <polygon points="0,12 3,-2 0,0 -3,-2" fill="#64748b" />
    <text y="-18" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#e10600" text-anchor="middle">N</text>
  </g>

